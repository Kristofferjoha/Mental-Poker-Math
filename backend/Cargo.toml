[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
hyper = { version = "1.6.0", features = ["full"] }
serde_json = "1.0.141"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

poker-logic = { path = "poker-logic" }
rayon = "1.10.0"
